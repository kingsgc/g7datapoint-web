<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="G7DataPoint brand icon">
  <defs>
    <linearGradient id="g7bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5c1c"/>
      <stop offset="0.55" stop-color="#06300c"/>
      <stop offset="1" stop-color="#032008"/>
    </linearGradient>
    <linearGradient id="g7bolt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#f0b100"/>
      <stop offset="1" stop-color="#ffc531"/>
    </linearGradient>
  </defs>

  <!-- Rounded app-icon tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#g7bg)"/>

  <!-- Subtle inner highlight -->
