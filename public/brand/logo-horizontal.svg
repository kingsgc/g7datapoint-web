<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" width="980" height="240">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18e2a6"/>
      <stop offset="0.55" stop-color="#0bbf9e"/>
      <stop offset="1" stop-color="#077a8c"/>
    </linearGradient>
    <linearGradient id="lg-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0b1e"/>
      <stop offset="1" stop-color="#123c4d"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <g transform="translate(20,20) scale(0.8333)">
    <rect x="0" y="0" width="240" height="240" rx="56" fill="url(#lg-bg)"/>
    <circle cx="120" cy="120" r="92" fill="none" stroke="#eafff7" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="460 120" transform="rotate(-45 120 120)" opacity="0.9"/>
    <circle cx="120" cy="28" r="10" fill="#ffffff"/>
    <text x="120" y="158" text-anchor="middle"
          font-family="Outfit, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="100"
          fill="#ffffff" letter-spacing="-3">G7</text>
    <circle cx="120" cy="188" r="7" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="140" font-family="Outfit, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="108" fill="url(#lg-word)" letter-spacing="-2">G7<tspan fill="#0bbf9e">DataPoint</tspan></text>
  <text x="306" y="192" font-family="Outfit, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="30" fill="#43555e" letter-spacing="6">DATA  ·  AIRTIME  ·  BILLS  ·  CABLE</text>
</svg>
